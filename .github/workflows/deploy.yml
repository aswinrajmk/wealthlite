name: Deploy and trigger tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "main @ ${GITHUB_SHA::7}"

      # Tell qa-tests that a new version is live. The suite runs there and streams results to the
      # portfolio dashboard. It never blocks this deploy.
      - name: Trigger the QA suite
        env:
          GH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::QA_DISPATCH_TOKEN is not set, so the QA suite was not triggered."
            exit 0
          fi
          first_line=$(printf '%s' "${COMMIT_MESSAGE:-manual deploy}" | head -n 1 | cut -c1-200)
          jq -n --arg sha "$GITHUB_SHA" --arg message "$first_line" --arg url "https://wealthlite.aswin-qa.workers.dev" \
            '{event_type: "wealthlite-deployed", client_payload: {sha: $sha, message: $message, url: $url}}' \
            | gh api repos/aswinrajmk/qa-tests/dispatches --input -
          echo "Triggered qa-tests for ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
