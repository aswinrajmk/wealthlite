name: Requirement changed

# When a requirement issue is opened, edited, labelled or reopened, ask qa-tests to draft or update its
# tests. Issue text reaches an AI agent there, so only issues written and changed by the owner count.
on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions: {}

jobs:
  notify-qa:
    if: >-
      contains(github.event.issue.labels.*.name, 'requirement') &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner &&
      (github.event.action != 'labeled' || github.event.label.name == 'requirement')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger test drafting in qa-tests
        env:
          GH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::QA_DISPATCH_TOKEN is not set, so qa-tests was not notified."
            exit 0
          fi
          jq -n --argjson issue "$ISSUE" --arg action "$ACTION" \
            '{event_type: "requirement-changed", client_payload: {issue: $issue, action: $action}}' \
            | gh api repos/aswinrajmk/qa-tests/dispatches --input -
          echo "Asked qa-tests to draft tests for requirement #$ISSUE ($ACTION)" >> "$GITHUB_STEP_SUMMARY"
